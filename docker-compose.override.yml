# Linux compatibility: host.docker.internal is a Docker Desktop (macOS/
# Windows) name and does not resolve on native Linux Docker. host-gateway
# maps it to the host's gateway IP so the default EMBED_API_URL works
# unchanged against an Ollama on the host.
services:
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Bulk ingest of large LongMemEval haystacks chunks+embeds many
      # segments per upstream call; the built-in 30s embed timeout is too
      # tight and intermittently trips "context deadline exceeded" mid-run.
      EMBED_TIMEOUT_SECONDS: "300"
